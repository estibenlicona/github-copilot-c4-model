<style>
:root{

  --brand:#2F4BD8;--brand2:#5B6BE8;--cyan:#0EA5A4;--lime:#16A34A;--amber:#D97706;

  --hd-grad:linear-gradient(90deg,#eef1fb,transparent);--kpi-a:#2F4BD8;--kpi-b:#0EA5A4;--glow:rgba(47,75,216,.12);
  --xs:#7c8aa0;--s:#22c55e;--m:#eab308;--l:#fb923c;--xl:#f43f5e;
  --ok:#16A34A;--ok-bg:#e7f6ec;--warn:#B45309;--warn-bg:#f9efdc;--bad:#DC2626;--bad-bg:#fbe5e5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);font-size:14px;line-height:1.45;

  background-attachment:fixed;min-height:100vh}
::selection{background:rgba(255,77,166,.35)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;letter-spacing:.05em}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;

@media(max-width:1000px){.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}}
.brandbox{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
.logo-dot{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));

.brandbox .nm{font-weight:700;font-size:14px;line-height:1.15}.brandbox .nm small{display:block;color:var(--muted);font-weight:400;font-size:10.5px;letter-spacing:.14em;margin-top:2px}
.navi{display:flex;flex-direction:column;gap:4px;flex:1}
@media(max-width:1000px){.navi{flex-direction:row;flex-wrap:wrap}}
.navi button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;font-size:13.5px;text-align:left;transition:.18s;width:100%}
.navi button:hover{background:var(--glass);color:var(--ink)}
.navi button.on{color:var(--ink);background:var(--nav-on);border-color:var(--line2);
  box-shadow:0 4px 14px rgba(0,0,0,.10)}
.navi button.on svg{filter:drop-shadow(0 0 6px rgba(255,77,166,.6))}
.navi svg{width:18px;height:18px;flex-shrink:0}
.io{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.io .btn{justify-content:center}
.main{padding:28px 34px 70px;max-width:none;width:100%}
@media(max-width:600px){.main{padding:20px 16px 50px}}
.head{margin-bottom:22px;padding-right:170px}
.head .kick{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--brand),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.head h1{font-size:27px;font-weight:760;letter-spacing:-.01em;margin-top:6px}
.head p{color:var(--muted);margin-top:5px;max-width:74ch;font-size:13.5px}
.fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);

.card .hd{padding:14px 18px;font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center;

.card .bd{padding:18px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.sec-t{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{border:1px solid var(--line2);background:var(--glass2);color:var(--ink);padding:9px 14px;border-radius:11px;font-size:13px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line)}

td.c,th.c{text-align:center}tbody tr:hover{background:var(--hover)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:30px;border:1px solid var(--line2)}
.chip.cuant{background:var(--surf);color:var(--cyan);border-color:var(--line2)}
.chip.cual{background:var(--surf);color:var(--muted)}
.pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:30px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.badgeT{display:inline-flex;align-items:center;justify-content:center;min-width:30px;color:#1b2030;font-weight:800;border-radius:8px;padding:3px 9px;font-size:13px}
.eval{display:grid;grid-template-columns:minmax(380px,0.85fr) minmax(560px,1.15fr);gap:18px;align-items:start}
@media(max-width:1080px){.eval{grid-template-columns:1fr}}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start}

.dimh:first-child{margin-top:0}.dimh::before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.q{padding:11px 2px;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:none}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q .txt b{color:var(--ink)}.help{font-size:11px;color:var(--faint);margin-top:3px}
.seg{display:inline-flex;margin-top:9px;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--seg-bg)}
.seg button{border:none;background:transparent;color:var(--muted);width:40px;height:32px;cursor:pointer;font-size:13px;font-weight:700;border-left:1px solid var(--line);transition:.14s}
.seg button:first-child{border-left:none}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.seg button:hover:not(.on){color:var(--ink);background:var(--seg-hover)}
.tq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.tq:last-child{border-bottom:none}
.tgl{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;flex-shrink:0;background:var(--seg-bg)}
.tgl button{border:none;background:transparent;color:var(--muted);padding:6px 14px;cursor:pointer;font-size:12.5px;font-weight:700;border-left:1px solid var(--line)}
.tgl button.on.si{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff}
.tgl button.on.no{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff}
.crit{font-size:9.5px;font-weight:800;color:var(--bad);background:var(--bad-bg);padding:2px 6px;border-radius:20px;margin-left:6px}
.reco{margin-top:12px;border-radius:13px;padding:13px;font-weight:650;font-size:13px;text-align:center;border:1px solid}
.reco.via{background:var(--ok-bg);border-color:rgba(52,211,153,.42);color:var(--ok)}
.reco.rec{background:var(--warn-bg);border-color:rgba(251,191,36,.42);color:var(--warn)}
.reco.obl{background:var(--bad-bg);border-color:rgba(251,113,133,.42);color:var(--bad)}
.res{position:sticky;top:18px}
.gauge-wrap{display:flex;gap:16px;align-items:center}
.gauge{position:relative;width:128px;height:128px;flex-shrink:0}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .ctr .tl{font-size:34px;font-weight:850;line-height:1}
.gauge .ctr .lb{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.kf .big{font-size:30px;font-weight:800;line-height:1}.kf .sub{color:var(--muted);font-size:11.5px;margin-top:3px}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:10px 12px;position:relative;overflow:hidden;cursor:help}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--brand),var(--brand2))}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:18px;font-weight:750;margin-top:2px}.stat .v small{font-size:11px;color:var(--muted);font-weight:500}
.note{border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:12px;border:1px solid var(--line2)}
.note b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--muted)}
.note.amber{background:var(--warn-bg);border-color:rgba(251,191,36,.32)}
.note.cyan{background:rgba(63,198,240,.10);border-color:rgba(63,198,240,.30)}
.note.lime{background:rgba(163,230,53,.10);border-color:rgba(163,230,53,.30)}
.dbar{margin-bottom:8px}.dbar .lab{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px}
.dbar .track{height:8px;background:var(--track);border-radius:6px;overflow:hidden}
.dbar .bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--brand2),var(--brand));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sfia{display:inline-flex;align-items:center;justify-content:center;min-width:22px;background:linear-gradient(135deg,rgba(145,104,240,.6),rgba(255,77,166,.6));color:#fff;border-radius:7px;font-weight:800;font-size:12px;padding:2px 4px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.kpi .n{font-size:30px;font-weight:820;background:linear-gradient(120deg,var(--kpi-a),var(--kpi-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.barrow{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px}
.barrow .nm{width:175px;flex-shrink:0}
.barrow .tk{flex:1;height:22px;background:var(--track);border-radius:8px;position:relative;overflow:hidden}
.barrow .tk .d{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:8px;transition:width .5s}
.barrow .tk .cap{position:absolute;top:-2px;height:26px;width:0;border-right:2px dashed #fff;opacity:.85}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.sumtag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:8px}
.radar-lab{font-size:9.5px;fill:var(--muted)}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
.subtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.subtabs button{padding:9px 15px;border-radius:12px;border:1px solid var(--line2);background:var(--glass);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:.16s}
.subtabs button:hover{color:var(--ink);background:var(--glass2)}
.subtabs button.on{color:#fff;background:linear-gradient(120deg,var(--brand),var(--brand2));border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.12)}

.themebtn{position:fixed;top:16px;right:20px;z-index:60;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);background:var(--glass2);backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14);transition:.2s}

.themebtn svg{width:21px;height:21px}
.phasebar{margin:8px 0 14px}
.phasebar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
.phase-lbl{font-weight:700;font-size:13.5px}
.ptrack{height:9px;background:var(--track);border-radius:6px;overflow:hidden}
.pfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--brand2),var(--brand));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.pdots{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.pdot{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--glass);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.pdot:hover{color:var(--ink);border-color:var(--brand)}
.pdot.done{background:var(--surf);color:var(--ink)}
.pdot.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.phasenav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.phasenav .btn:disabled{opacity:.4;cursor:not-allowed}
.demo-ex{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.demo-ex .small{width:100%;margin-bottom:1px}
.demo-ex .btn{flex:1 1 60px;justify-content:center;padding:6px 6px}
.ctip{position:fixed;z-index:200;max-width:262px;background:#1f2430;color:#f4f6fb;font-size:12px;font-weight:400;line-height:1.5;padding:11px 13px;border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);pointer-events:none}
.tgh{text-align:center;padding:7px 6px;font-weight:700}
.tgalt{background:var(--surf)}
.rolecard{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--surf)}
.rolehd{font-weight:700;margin-bottom:4px;color:var(--ink)}
.rolelv{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.rolelv .sfia{margin-top:1px;flex-shrink:0}
.qlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scalegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}
.scalerow{display:flex;align-items:center;gap:9px}
.scoreb{width:28px;height:28px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.opt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);background:var(--surf);border:1px solid var(--line2);border-radius:9px;padding:6px 11px 6px 7px;cursor:pointer;transition:.14s;font-family:inherit;line-height:1.2}
.opt:hover{border-color:var(--brand);background:var(--glass2)}

.opt.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 4px 13px rgba(0,0,0,.14)}
.opt.on b{background:rgba(255,255,255,.26);color:#fff}
</style>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

/* ================= DATOS DEL MODELO ================= */
const DIMS=["Negocio y cliente","Alcance funcional","Integraciones","Datos, seguridad y cumplimiento","Tecnología y arquitectura","Operación y soporte","Incertidumbre y dependencias"];

 qualLabels:["Sin impacto / no aplica","Bajo","Medio","Alto","Crítico / muy alto"],
 quantRanges:{

 },
 questions:[

  ["N4",0,"¿Cuántas áreas de negocio u operación deben coordinarse?",1,"areas"],

  ["F3",1,"¿Incluye reglas de negocio complejas, parametrización o flujos de aprobación?",2,"cual"],
  ["F4",1,"¿Requiere trazabilidad, reversos, conciliación o auditoría funcional?",3,"cual"],

  ["S1",3,"¿Procesa datos personales, financieros, transaccionales o sensibles?",3,"cual"],

/* ================= LÓGICA ================= */
function maxPts(cfg){return cfg.questions.reduce((a,q)=>a+4*q[3],0)}
function compute(cfg,ans,plazo){
  const MP=maxPts(cfg);const pts=cfg.questions.reduce((a,q,i)=>a+(ans[i]||0)*q[3],0);
  const pct=MP?Math.round(pts/MP*1000)/10:0;
  let idx=cfg.tallas.findIndex(t=>pct<=t.max);if(idx<0)idx=cfg.tallas.length-1;
  const t=cfg.tallas[idx];const pl=Math.max(0.1,plazo||1);
  const fMin=t.pmMin/pl,fMax=t.pmMax/pl,fMed=((t.pmMin+t.pmMax)/2)/pl;
  const dp=Array(7).fill(0),dm=Array(7).fill(0);
  cfg.questions.forEach((q,i)=>{dp[q[1]]+=(ans[i]||0)*q[3];dm[q[1]]+=4*q[3];});
  const dims=DIMS.map((d,k)=>({d,short:DIM_SHORT[k],pct:dm[k]?Math.round(dp[k]/dm[k]*100):0}));
  const mix=cfg.caps.map(c=>({n:c.n,sfia:c.sfia[idx],mixPct:c.mix[idx],fte:c.mix[idx]/100*fMed})).filter(x=>x.mixPct>0&&x.sfia>0);
  return {pts,MP,pct,idx,t,fMin,fMax,fMed,dims,mix,plazo:pl};
}
function triageEval(cfg,tri){
  const count=tri.filter(Boolean).length;const crit=tri.some((v,i)=>v&&cfg.triage[i].c);
  if(crit||count>=3)return{cls:"obl",txt:"Evaluación completa obligatoria — talla probable M o superior"};
  if(count>=1)return{cls:"rec",txt:"Evaluación completa recomendada — talla probable S–M"};
  return{cls:"via",txt:"Vía rápida (XS–S) — no requiere evaluación completa"};
}

function Radar({dims}){
  const N=dims.length,R=78,cx=100,cy=95;
  const pt=(val,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;const rr=R*Math.min(100,val)/100;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];};
  const axis=(i)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+R*Math.cos(a),cy+R*Math.sin(a)];};
  const poly=dims.map((d,i)=>pt(d.pct,i).join(",")).join(" ");
  const labpos=(i)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+(R+15)*Math.cos(a),cy+(R+15)*Math.sin(a)];};
  return (
   <svg width="100%" viewBox="0 0 200 200" style={{maxHeight:200}}>
     <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" style={{stopColor:"var(--cyan)"}}/><stop offset="100%" style={{stopColor:"var(--brand)"}}/></linearGradient></defs>
     {[25,50,75,100].map(g=>(<polygon key={g} points={dims.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;const rr=R*g/100;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)].join(",")}).join(" ")} fill="none" stroke="var(--track)"/>))}
     {dims.map((_,i)=>{const[x,y]=axis(i);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--track)"/>})}
     <polygon points={poly} fill="url(#rg)" fillOpacity={0.35} stroke="var(--brand)" strokeWidth="1.8" opacity="1" style={{transition:"all .5s"}}/>
     {dims.map((d,i)=>{const[x,y]=pt(d.pct,i);return <circle key={i} cx={x} cy={y} r="2.4" fill="var(--brand)"/>})}
     {dims.map((d,i)=>{const[x,y]=labpos(i);return <text key={i} x={x} y={y} className="radar-lab" textAnchor="middle" dominantBaseline="middle">{d.short}</text>})}
   </svg>
  );
}

                <div><label className="lab">Plazo (meses)</label><input type="number" min="1" value={cur.plazo} onChange={e=>set({plazo:parseFloat(e.target.value)||1})}/></div>
                <div><label className="lab">Estado</label><select value={cur.estado} onChange={e=>set({estado:e.target.value})}><option>Evaluación</option><option>Activa</option><option>Cerrada</option></select></div>
              </div>
            </div>
            <div className="phasebar">
              <div className="phasebar-top">
                <span className="phase-lbl">Fase {phase+1} de {NPH} · {phase===0?"Tamizaje inicial":DIMS[phase-1]}</span>
                <span className="muted small">{NPH-phase-1>0?(NPH-phase-1)+" fase(s) restante(s)":"última fase"}</span>
              </div>
              <div className="ptrack"><div className="pfill" style={{width:((phase+1)/NPH*100)+"%"}}/></div>
              <div className="pdots">{Array.from({length:NPH}).map((_,k)=>(<button key={k} className={"pdot"+(k===phase?" on":k<phase?" done":"")} title={k===0?"Tamizaje":DIMS[k-1]} onClick={()=>setPhase(k)}>{k===0?"T":k}</button>))}</div>
            </div>
            {phase===0 ? (
              <div>
                <p className="muted small" style={{margin:"2px 0 10px"}}>Responde el tamizaje. Según el resultado se define si la iniciativa requiere la evaluación completa de las 7 dimensiones.</p>
                {cfg.triage.map((t,i)=>(
                  <div className="tq" key={i}>
                    <div>{t.t}{t.c&&<span className="crit">crítica</span>}</div>
                    <div className="tgl">
                      <button className={"no"+(!cur.tri[i]?" on":"")} onClick={()=>setTri(i,false)}>No</button>
                      <button className={"si"+(cur.tri[i]?" on":"")} onClick={()=>setTri(i,true)}>Sí</button>
                    </div>
                  </div>))}
                <div className={"reco "+tri.cls}>{tri.txt}</div>
                <div className="note cyan" style={{marginTop:12}}><b>Siguiente paso</b>{tri.cls==="via"?"El tamizaje sugiere vía rápida (XS–S). Puedes guardar así o continuar la evaluación completa para mayor detalle.":"Continúa con las 7 fases de la evaluación completa."}</div>
              </div>
            ) : phaseQs.map(({q,i})=>{
              const quant=q[4]!=="cual";const labs=quant?cfg.quantRanges[q[4]]:cfg.qualLabels;
              return (
                <div className="q" key={i}>
                  <div className="top">
                    <div className="txt"><b>{q[0]}.</b> {q[2]}</div>
                    <span className={"chip "+(quant?"cuant":"cual")}>{quant?"Cuantitativa":"Cualitativa"}</span>
                  </div>
                  <div className="opts">{labs.map((o,v)=>(<button key={v} className={"opt"+(cur.ans[i]===v?" on":"")} onClick={()=>setAns(i,v)} title={"Puntaje "+v}><b>{v}</b> {o}</button>))}</div>
                </div>
              );
            })}
            <div className="phasenav">
              <button className="btn" disabled={phase===0} onClick={()=>setPhase(Math.max(0,phase-1))}>‹ Anterior</button>
              {phase===0
                ? <button className="btn pri" onClick={()=>setPhase(1)}>Comenzar evaluación ›</button>
                : phase<NPH-1
                ? <button className="btn pri" onClick={()=>setPhase(phase+1)}>Siguiente ›</button>
                : <button className="btn pri" onClick={()=>onSave(cur,R)}>Guardar resultado</button>}
            </div>
          </div>
        </div>
      </div>

      <div className="res">
        <div className="card">
          <div className="hd">Resultados <button className="btn sm pri" onClick={()=>onSave(cur,R)}><Ico d={icons.plus} width="14" height="14"/>Guardar</button></div>
          <div className="bd">
            <div className="resgrid">
            <div>
            <div className="gauge-wrap">
              <Gauge pct={R.pct} talla={R.t.n} color={col}/>
              <div className="kf">
                <div className="big" style={{color:col}}>{R.pct}%</div>
                <div className="sub">complejidad<br/>{R.pts}/{R.MP} puntos</div>
              </div>
            </div>
            <div className="small muted" style={{margin:"2px 0 9px"}}>FTE estimados para el plazo objetivo de <b style={{color:"var(--ink)"}}>{cur.plazo} {cur.plazo===1?"mes":"meses"}</b>.</div>
            <div className="statg">
              <div className="stat" onMouseEnter={e=>setTip({t:tips.pm,x:e.clientX,y:e.clientY})} onMouseLeave={()=>setTip(null)}><div className="k">Esfuerzo</div><div className="v">{R.t.pmMin}–{R.t.pmMax} <small>PM</small></div></div>
              <div className="stat" onMouseEnter={e=>setTip({t:tips.med,x:e.clientX,y:e.clientY})} onMouseLeave={()=>setTip(null)}><div className="k">FTE esperado</div><div className="v">{fmt(R.fMed)} <small>FTE</small></div></div>
              <div className="stat" onMouseEnter={e=>setTip({t:tips.min,x:e.clientX,y:e.clientY})} onMouseLeave={()=>setTip(null)}><div className="k">Optimista</div><div className="v">{fmt(R.fMin)} <small>FTE</small></div></div>
              <div className="stat" onMouseEnter={e=>setTip({t:tips.max,x:e.clientX,y:e.clientY})} onMouseLeave={()=>setTip(null)}><div className="k">Pesimista</div><div className="v">{fmt(R.fMax)} <small>FTE</small></div></div>
            </div>
            <div className="note amber"><b>Banda de incertidumbre</b>Estimación temprana: el esfuerzo real puede variar ~{factor}× entre el escenario optimista y el pesimista. Se estrecha con discovery.</div>
            <div className="note cyan"><b>Lectura ejecutiva</b>{R.t.lec}</div>
            <div className="note lime"><b>Acción recomendada</b>{R.t.acc}</div>
            </div>
            <div>
            <div className="sec-t" style={{marginTop:0}}>Complejidad por dimensión</div>
            <Radar dims={R.dims}/>
            <div style={{marginTop:8}}>
              {R.dims.map((d,k)=>(<div className="dbar" key={k}><div className="lab"><span>{d.d}</span><span className="muted">{d.pct}%</span></div><div className="track"><div className="bar" style={{width:d.pct+"%"}}/></div></div>))}
            </div>
            </div>
            </div>
            <div className="sec-t" style={{marginTop:18}}>Mix de capacidades</div>
            <table><thead><tr><th>Capacidad</th><th className="c">SFIA</th><th className="c">%</th><th className="c">FTE</th></tr></thead>
              <tbody>
                {R.mix.map((m,k)=>(<tr key={k}><td>{m.n}</td><td className="c"><span className="sfia">{m.sfia}</span></td><td className="c">{m.mixPct}%</td><td className="c">{fmt(m.fte)}</td></tr>))}
                <tr style={{fontWeight:700}}><td>Total</td><td className="c">—</td><td className="c">{R.mix.reduce((a,m)=>a+m.mixPct,0)}%</td><td className="c">{fmt(R.mix.reduce((a,m)=>a+m.fte,0))}</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
   </div>
  );
}

/* ================= PORTAFOLIO ================= */
function Portafolio({cfg,portfolio,setPortfolio,onEdit}){
  const rows=portfolio.map(p=>({p,R:compute(cfg,p.ans,p.plazo)}));
  const activas=rows.filter(x=>x.p.estado==="Activa");
  const totFte=activas.reduce((a,x)=>a+x.R.fMed,0);
  const byTalla={};rows.forEach(x=>byTalla[x.R.t.n]=(byTalla[x.R.t.n]||0)+1);
  const tallaOrder=["XS","S","M","L","XL"];
  const maxC=Math.max(1,...tallaOrder.map(t=>byTalla[t]||0));
  const setEstado=(id,v)=>setPortfolio(portfolio.map(p=>p.id===id?{...p,estado:v}:p));
  const del=id=>{if(confirm("¿Eliminar esta iniciativa?"))setPortfolio(portfolio.filter(p=>p.id!==id));};
  return (
   <div className="fade">
    <div className="head"><div className="kick">Portafolio</div><h1>Portafolio de iniciativas</h1><p>Iniciativas evaluadas y guardadas. Cambia el estado a <b>Activa</b> para incluirlas en la demanda de capacidad.</p></div>
    <div className="grid g4" style={{marginBottom:16}}>
      <div className="kpi"><div className="n">{portfolio.length}</div><div className="l">Iniciativas</div></div>
      <div className="kpi"><div className="n">{activas.length}</div><div className="l">Activas</div></div>
      <div className="kpi"><div className="n">{fmt(totFte)}</div><div className="l">FTE demandado (activas)</div></div>
      <div className="kpi"><div className="n">{Object.keys(byTalla).length}</div><div className="l">Tallas presentes</div></div>
    </div>
    <div className="grid g2">
      <div className="card"><div className="hd">Distribución por talla</div><div className="bd">
        {tallaOrder.map(t=>(<div className="barrow" key={t}><div className="nm" style={{width:40}}><span className="badgeT" style={{background:TALLA_COL[t]}}>{t}</span></div>
          <div className="tk"><div className="d" style={{width:((byTalla[t]||0)/maxC*100)+"%"}}/></div><div style={{width:30,textAlign:"right"}}>{byTalla[t]||0}</div></div>))}
      </div></div>
      <div className="card"><div className="hd">Resumen</div><div className="bd small muted" style={{lineHeight:1.7}}>
        El portafolio agrega {portfolio.length} iniciativa(s). La demanda de capacidad (módulo siguiente) suma solo las <b style={{color:"var(--ink)"}}>activas</b>: {activas.length}, equivalentes a <b style={{color:"var(--ink)"}}>{fmt(totFte)} FTE</b> de esfuerzo medio simultáneo. Recuerda que el FTE depende del plazo de cada iniciativa.
      </div></div>
    </div>
    <div className="card" style={{marginTop:16}}>
      <div className="hd">Iniciativas</div>
      <div className="bd" style={{padding:0}}>
        {!portfolio.length? <div className="empty">Aún no hay iniciativas. Ve a <b>Evaluar</b> y guarda una.</div> :
        <table><thead><tr><th>Iniciativa</th><th className="c">Talla</th><th className="c">Compl.</th><th className="c">PM</th><th className="c">Plazo</th><th className="c">FTE</th><th>Estado</th><th></th></tr></thead>
          <tbody>{rows.map(({p,R})=>(<tr key={p.id}>
            <td>{p.nombre}</td>
            <td className="c"><span className="badgeT" style={{background:TALLA_COL[R.t.n]}}>{R.t.n}</span></td>
            <td className="c">{R.pct}%</td><td className="c">{R.t.pmMin}–{R.t.pmMax}</td><td className="c">{p.plazo}m</td><td className="c">{fmt(R.fMed)}</td>
            <td><select style={{width:120,padding:"5px 8px"}} value={p.estado} onChange={e=>setEstado(p.id,e.target.value)}><option>Evaluación</option><option>Activa</option><option>Cerrada</option></select></td>
            <td className="c" style={{whiteSpace:"nowrap"}}><button className="btn sm" onClick={()=>onEdit(p)}>Editar</button> <button className="btn sm gh" onClick={()=>del(p.id)}>✕</button></td>
          </tr>))}</tbody>
        </table>}
      </div>
    </div>
   </div>
  );
}

/* ================= CAPACIDAD ================= */
function Capacidad({cfg,portfolio,capacity,setCapacity}){
  const demand={};
  portfolio.filter(p=>p.estado==="Activa").forEach(p=>{compute(cfg,p.ans,p.plazo).mix.forEach(m=>{demand[m.n]=(demand[m.n]||0)+m.fte;});});
  const names=cfg.caps.map(c=>c.n);
  const maxV=Math.max(1,...names.map(n=>Math.max(demand[n]||0,capacity[n]||0)));
  const totD=Object.values(demand).reduce((a,b)=>a+b,0);
  const totC=names.reduce((a,n)=>a+(capacity[n]||0),0);
  const setCap=(n,v)=>setCapacity({...capacity,[n]:parseFloat(v)||0});
  return (
   <div className="fade">
    <div className="head"><div className="kick">Capacidad</div><h1>Capacidad y demanda</h1><p>Captura el FTE disponible por capacidad y compáralo con la demanda agregada de las iniciativas <b>activas</b>.</p></div>
    <div className="grid g3" style={{marginBottom:16}}>
      <div className="kpi"><div className="n">{fmt(totD)}</div><div className="l">FTE demandado</div></div>
      <div className="kpi"><div className="n">{fmt(totC)}</div><div className="l">FTE disponible</div></div>
      <div className="kpi"><div className="n" style={{WebkitTextFillColor:(totC-totD>=0?"var(--ok)":"var(--bad)")}}>{totC-totD>=0?"+":""}{fmt(totC-totD)}</div><div className="l">Balance</div></div>
    </div>
    <div className="card"><div className="hd">Demanda vs. capacidad por capacidad</div><div className="bd">
      {names.map(n=>{const d=demand[n]||0,c=capacity[n]||0,gap=c-d;const st=gap>=0?"ok":(d-c<=0.5?"warn":"bad");
        return (<div className="barrow" key={n}>
          <div className="nm">{n}</div>
          <div className="tk"><div className="d" style={{width:(d/maxV*100)+"%"}}/><div className="cap" style={{left:Math.min(99.5,c/maxV*100)+"%"}}/></div>
          <div style={{width:185,textAlign:"right",fontSize:12}}>dem {fmt(d)} · cap <input className="mini" type="number" min="0" step="0.1" value={c} onChange={e=>setCap(n,e.target.value)}/> <span className={"pill "+st}>{gap>=0?"+":""}{fmt(gap)}</span></div>
        </div>);})}
      <div className="small muted" style={{marginTop:10}}>La barra muestra la demanda; la línea punteada blanca, tu capacidad disponible.</div>
    </div></div>
   </div>
  );
}

/* ================= CALIBRACIÓN ================= */
function Calibracion({cfg,portfolio,setPortfolio}){
  const rows=portfolio.map(p=>({p,R:compute(cfg,p.ans,p.plazo)}));
  let withReal=0,sumF=0;
  rows.forEach(({p,R})=>{if(p.real&&p.real.fte&&R.fMed>0){withReal++;sumF+=p.real.fte/R.fMed;}});
  const avgF=withReal?sumF/withReal:null;
  const setReal=(id,k,v)=>setPortfolio(portfolio.map(p=>p.id===id?{...p,real:{...(p.real||{fte:null,dur:null}),[k]:v===""?null:parseFloat(v)}}:p));
  return (
   <div className="fade">
    <div className="head"><div className="kick">Calibración</div><h1>Calibración con datos reales</h1><p>Registra el FTE y la duración reales al cerrar cada iniciativa. La plataforma calcula la desviación y el factor de ajuste.</p></div>
    <div className="grid g3" style={{marginBottom:16}}>
      <div className="kpi"><div className="n">{withReal}</div><div className="l">Con datos reales</div></div>
      <div className="kpi"><div className="n">{avgF?fmt(avgF)+"×":"—"}</div><div className="l">Factor real/estimado</div></div>
      <div className="kpi"><div className="n" style={{fontSize:20}}>{avgF?(avgF>1.1?"Subestima":avgF<0.9?"Sobreestima":"Ajustado"):"—"}</div><div className="l">Tendencia</div></div>
    </div>
    <div className="card"><div className="hd">Estimado vs. real</div><div className="bd" style={{padding:0}}>
      {!portfolio.length? <div className="empty">Guarda iniciativas en el portafolio para calibrar.</div> :
      <table><thead><tr><th>Iniciativa</th><th className="c">Talla</th><th className="c">FTE estimado</th><th className="c">FTE real</th><th className="c">Duración real</th><th className="c">Desviación</th></tr></thead>
        <tbody>{rows.map(({p,R})=>{const est=R.fMed;const real=(p.real&&p.real.fte)??"";const dur=(p.real&&p.real.dur)??"";
          const dev=(real!==""&&real!==null&&est>0)?((real-est)/est*100):null;
          return (<tr key={p.id}>
            <td>{p.nombre}</td><td className="c"><span className="badgeT" style={{background:TALLA_COL[R.t.n]}}>{R.t.n}</span></td>
            <td className="c">{fmt(est)}</td>
            <td className="c"><input className="mini" type="number" min="0" step="0.1" value={real} onChange={e=>setReal(p.id,"fte",e.target.value)}/></td>
            <td className="c"><input className="mini" type="number" min="0" step="0.1" value={dur} placeholder="m" onChange={e=>setReal(p.id,"dur",e.target.value)}/></td>
            <td className="c">{dev===null?"—":<span className={"pill "+(Math.abs(dev)<=15?"ok":Math.abs(dev)<=35?"warn":"bad")}>{dev>=0?"+":""}{Math.round(dev)}%</span>}</td>
          </tr>);})}</tbody>
      </table>}
    </div></div>
   </div>
  );
}

/* ================= PARÁMETROS ================= */
function Parametros({cfg,setCfg,onReset}){
  const [tab,setTab]=useState("pesos");
  const upd=fn=>{const c=clone(cfg);fn(c);setCfg(c);};
  const sums=cfg.tallas.map((_,ti)=>cfg.caps.reduce((a,c)=>a+c.mix[ti],0));
  const tabs=[["pesos","Pesos por pregunta"],["tallas","Tallas y esfuerzo"],["mix","Mix y SFIA"],["escalas","Escalas"]];
  return (
   <div className="fade">
    <div className="head" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:12}}>
      <div><div className="kick">Recalibración</div><h1>Parámetros del modelo</h1><p>Recalibra cada grupo de parámetros desde su pestaña. Los cambios se guardan y recalculan al instante.</p></div>
      <button className="btn" onClick={onReset}>↺ Restaurar por defecto</button>
    </div>
    <div className="subtabs">{tabs.map(([k,l])=>(<button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>))}</div>

    {tab==="pesos"&&<div className="card fade"><div className="hd">Pesos por pregunta · máximo {maxPts(cfg)} puntos</div><div className="bd"><div className="grid g2">
      {cfg.questions.map((q,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid var(--line)"}}>
        <span className="small qlabel" title={q[2]}><b>{q[0]}</b> {q[2]}</span>
        <input className="mini" type="number" min="0" max="5" value={q[3]} onChange={e=>upd(c=>c.questions[i][3]=parseInt(e.target.value)||0)}/></div>))}
    </div></div></div>}

    {tab==="tallas"&&<div className="card fade"><div className="hd">Tallas: complejidad y esfuerzo (PM)</div><div className="bd" style={{overflowX:"auto"}}>
      <table><thead><tr><th>Talla</th><th className="c">% mín</th><th className="c">% máx</th><th className="c">PM mín</th><th className="c">PM máx</th><th>Lectura</th></tr></thead>
        <tbody>{cfg.tallas.map((t,i)=>(<tr key={i}><td><b>{t.n}</b></td>
          {["min","max","pmMin","pmMax"].map(k=>(<td className="c" key={k}><input className="mini" type="number" value={t[k]} onChange={e=>upd(c=>c.tallas[i][k]=parseFloat(e.target.value)||0)}/></td>))}
          <td><input value={t.lec} onChange={e=>upd(c=>c.tallas[i].lec=e.target.value)}/></td></tr>))}</tbody>
      </table>
    </div></div>}

    {tab==="mix"&&<div className="card fade"><div className="hd">Mix de capacidades (%) y nivel SFIA por talla</div><div className="bd" style={{overflowX:"auto"}}>
      <table>
        <thead>
          <tr><th rowSpan="2">Capacidad</th>{cfg.tallas.map((t,i)=>(<th key={t.n} colSpan="2" className={"tgh"+(i%2?" tgalt":"")} style={{borderLeft:"3px solid "+(TALLA_COL[t.n]||"var(--line2)")}}><span className="badgeT" style={{background:TALLA_COL[t.n]}}>{t.n}</span></th>))}</tr>
          <tr>{cfg.tallas.map((t,i)=>(<React.Fragment key={t.n}><th className={"c"+(i%2?" tgalt":"")} style={{borderLeft:"3px solid "+(TALLA_COL[t.n]||"var(--line2)")}}>% mix</th><th className={"c"+(i%2?" tgalt":"")}>SFIA</th></React.Fragment>))}</tr>
        </thead>
        <tbody>{cfg.caps.map((c,ci)=>(<tr key={ci}><td>{c.n}</td>
          {c.mix.map((m,ti)=>(<React.Fragment key={ti}>
            <td className={"c"+(ti%2?" tgalt":"")} style={{borderLeft:"3px solid "+(TALLA_COL[cfg.tallas[ti].n]||"var(--line2)")}}><input className="mini" type="number" value={m} onChange={e=>upd(cc=>cc.caps[ci].mix[ti]=parseFloat(e.target.value)||0)}/></td>
            <td className={"c"+(ti%2?" tgalt":"")}><input className="mini" type="number" min="0" max="7" value={c.sfia[ti]} onChange={e=>upd(cc=>cc.caps[ci].sfia[ti]=parseInt(e.target.value)||0)}/></td>
          </React.Fragment>))}</tr>))}
          <tr style={{fontWeight:700}}><td>Suma %</td>{sums.map((sm,i)=>(<td className={"c"+(i%2?" tgalt":"")} colSpan="2" key={i} style={{borderLeft:"3px solid "+(TALLA_COL[cfg.tallas[i].n]||"var(--line2)")}}><span className={"sumtag pill "+(sm===100?"ok":"bad")}>{sm}%</span></td>))}</tr>
        </tbody>
      </table>
      <div className="small muted" style={{marginTop:8}}>Cada talla agrupa dos columnas: <b>% mix</b> (cuánta gente de ese rol) y <b>SFIA</b> (su nivel). El % de cada talla debe sumar 100%. SFIA 0 = no se asigna de forma dedicada.</div>
    </div></div>}

    {tab==="escalas"&&<div className="card fade"><div className="hd">Opciones de respuesta del formulario</div><div className="bd">
      <div style={{background:"var(--surf)",border:"1px solid var(--line)",borderRadius:11,padding:"11px 13px",fontSize:13,marginBottom:16,lineHeight:1.55}}>Estas son las opciones que verá quien responde el formulario. El recuadro numerado (<b>0–4</b>) es el <b>puntaje</b> que aporta esa opción; el texto a su lado es <b>lo que se muestra</b>. Puedes editar los textos sin cambiar el puntaje.</div>
      <div className="sec-t">Escala cualitativa · preguntas de juicio</div>
      <div className="small muted" style={{marginBottom:2}}>La usan todas las preguntas marcadas como “Cualitativa”.</div>
      <div className="scalegrid">{cfg.qualLabels.map((l,i)=>(<div className="scalerow" key={i}><span className="scoreb">{i}</span><input value={l} onChange={e=>upd(c=>c.qualLabels[i]=e.target.value)}/></div>))}</div>
      {Object.keys(cfg.quantRanges).map(key=>{const qs=cfg.questions.filter(q=>q[4]===key);return (<div key={key}>
        <div className="sec-t" style={{marginTop:18}}>Conteo · {QKEY_LABEL[key]||key}</div>
        <div className="small muted" style={{marginBottom:2}}>{qs.length?("La usa "+qs.map(q=>q[0]).join(", ")+": “"+qs[0][2]+"”"):"Sin preguntas asociadas."}</div>
        <div className="scalegrid">{cfg.quantRanges[key].map((o,i)=>(<div className="scalerow" key={i}><span className="scoreb">{i}</span><input value={o} onChange={e=>upd(c=>c.quantRanges[key][i]=e.target.value)}/></div>))}</div>
      </div>);})}
    </div></div>}
   </div>
  );
}

/* ================= APP ================= */
function Sfia(){
  return (
   <div className="fade">
    <div className="head"><div className="kick">Referencia</div><h1>Niveles SFIA</h1></div>
    <div className="card" style={{marginBottom:16}}><div className="hd">Escala de niveles de responsabilidad</div><div className="bd" style={{overflowX:"auto"}}>
      <table><thead><tr><th>Nivel</th><th>Guía</th><th>Qué implica</th><th>Uso en staffing</th></tr></thead>
        <tbody>{SFIA_LEVELS.map(l=>(<tr key={l.n}><td className="c"><span className="sfia">{l.n}</span></td><td><b>{l.guia}</b></td><td>{l.implica}</td><td className="muted">{l.uso}</td></tr>))}</tbody>
      </table>
    </div></div>
    <div className="card"><div className="hd">Qué cubre cada rol según su nivel</div><div className="bd">
      <div className="grid g2">
        {Object.keys(ROLE_LEVELS).map(role=>(<div className="rolecard" key={role}>
          <div className="rolehd">{role}</div>
          {Object.keys(ROLE_LEVELS[role]).map(lv=>(<div className="rolelv" key={lv}><span className="sfia">{lv}</span><span>{ROLE_LEVELS[role][lv]}</span></div>))}
        </div>))}
      </div>
    </div></div>
   </div>
  );
}
function App(){
  const [cfg,setCfg]=useLS("mdtR_config",DEFAULTS);
  const [portfolio,setPortfolio]=useLS("mdtR_portfolio",[]);
  const [capacity,setCapacity]=useLS("mdtR_capacity",{});
  const [view,setView]=useState("evaluar");
  const [tip,setTip]=useState(null);
  const [theme,setTheme]=useLS("mdtR_theme","azul");
  useEffect(()=>{applyTheme(theme);},[theme]);
  const [cur,setCur]=useState({id:null,nombre:"",plazo:6,estado:"Evaluación",ans:DEFAULTS.questions.map(()=>0),tri:DEFAULTS.triage.map(()=>false),real:{fte:null,dur:null}});
  const fileRef=useRef();
  const [resetKey,setResetKey]=useState(0);
  const loadExample=(k)=>{const e=EXAMPLES[k];setCur({id:null,nombre:e.nombre,plazo:e.plazo,estado:"Evaluación",ans:e.ans.slice(),tri:e.tri.slice(),real:{fte:null,dur:null}});setResetKey(x=>x+1);setView("evaluar");};
  const clearForm=()=>{setCur({id:null,nombre:"",plazo:6,estado:"Evaluación",ans:cfg.questions.map(()=>0),tri:cfg.triage.map(()=>false),real:{fte:null,dur:null}});setResetKey(x=>x+1);setView("evaluar");};

  const saveToPf=(c)=>{
    if(!c.nombre.trim()){alert("Ponle un nombre a la iniciativa antes de guardar.");return;}
    const item={id:c.id||Date.now(),nombre:c.nombre,plazo:c.plazo,estado:c.estado,ans:c.ans.slice(),tri:c.tri.slice(),real:c.real||{fte:null,dur:null}};
    setPortfolio(prev=>{const ix=prev.findIndex(p=>p.id===item.id);if(ix>=0){const n=prev.slice();n[ix]=item;return n;}return [...prev,item];});
    setCur({...c,id:item.id});alert("Guardado en el portafolio.");
  };
  const editPf=p=>{setCur({id:p.id,nombre:p.nombre,plazo:p.plazo,estado:p.estado,ans:p.ans.slice(),tri:p.tri.slice(),real:p.real||{fte:null,dur:null}});setView("evaluar");};
  const reset=()=>{if(confirm("¿Restaurar todos los parámetros a los valores por defecto? No borra iniciativas."))setCfg(clone(DEFAULTS));};
  const exportAll=()=>{const data={config:cfg,portfolio,capacity,_meta:{app:"plataforma-dimensionamiento",fecha:new Date().toISOString()}};
    const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="respaldo_dimensionamiento.json";a.click();};
  const importAll=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.config)setCfg(d.config);if(d.portfolio)setPortfolio(d.portfolio);if(d.capacity)setCapacity(d.capacity);alert("Respaldo importado.");}catch(err){alert("Archivo no válido.");}};
    r.readAsText(f);e.target.value="";};
  const loadDemo=()=>{
    if(!confirm("Esto cargará un portafolio de ejemplo y reemplazará las iniciativas y la capacidad actuales. ¿Continuar?"))return;
    const E=EXAMPLES;
    const mk=(id,nombre,ex,plazo,estado,real)=>({id:id,nombre:nombre,plazo:plazo,estado:estado,ans:E[ex].ans.slice(),tri:E[ex].tri.slice(),real:real||{fte:null,dur:null}});
    const demo=[
      mk(1001,"Ajuste de mensajes en App","pequena",3,"Cerrada",{fte:1.9,dur:3}),
      mk(1002,"Pago con QR en App","mediana",6,"Activa",null),
      mk(1003,"Originación de crédito con terceros","grande",9,"Activa",null),
      mk(1004,"Nueva pantalla de saldos en App","pequena",4,"Activa",null),
      mk(1005,"Motor antifraude de tarjetas","grande",12,"Evaluación",null),
      mk(1006,"Reportes regulatorios de cartera","mediana",5,"Cerrada",{fte:2.6,dur:7})
    ];
    setPortfolio(demo);
    setCapacity({"Product Owner / Negocio":1.5,"Analista negocio / funcional":1.5,"Arquitectura de solución":1,"Desarrollo Backend / API":2.5,"Desarrollo Frontend / Mobile":1.5,"QA / Automatización":1.5,"Seguridad / AppSec":1,"DevOps / Plataforma":1,"Datos / Integración":0.5,"UX/UI / Experiencia":0.5,"Operación / SRE":0.5});
    setCur({id:null,nombre:E.grande.nombre,plazo:9,estado:"Evaluación",ans:E.grande.ans.slice(),tri:E.grande.tri.slice(),real:{fte:null,dur:null}});
    setView("portafolio");
    alert("Datos de ejemplo cargados. Recorre Portafolio, Capacidad y demanda, y Calibración.");
  };

  const cycleTheme=()=>{const ks=Object.keys(THEMES);setTheme(ks[(ks.indexOf(theme)+1)%ks.length]);};
  const _tk=Object.keys(THEMES);const nextKey=_tk[(_tk.indexOf(theme)+1)%_tk.length];const nextColor=THEMES[nextKey].vars["--brand"];
  const navItems=[["evaluar","Evaluar"],["portafolio","Portafolio"],["capacidad","Capacidad y demanda"],["calibracion","Calibración"],["sfia","Niveles SFIA"],["parametros","Parámetros"]];
  return (
   <div className="app">
    <button className="themebtn" onClick={cycleTheme} title={"Cambiar a tema "+THEMES[nextKey].label} style={{background:nextColor+"24",borderColor:nextColor+"7a"}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
    <aside className="side">
      <div className="brandbox"><div className="logo-dot">◈</div><div className="nm">Dimensionamiento<small>CÉLULAS TI · TUYA</small></div></div>
      <div className="navi">
        {navItems.map(([k,l])=>(<button key={k} className={view===k?"on":""} onClick={()=>setView(k)}><Ico d={icons[k]}/>{l}</button>))}
      </div>
      <div className="io">
        <button className="btn" style={{background:"linear-gradient(120deg,var(--brand),var(--brand2))",color:"#fff",border:"none",fontWeight:650,boxShadow:"0 6px 16px rgba(0,0,0,.16)"}} onClick={loadDemo}>★ Cargar datos demo</button>
        <div className="demo-ex"><span className="small muted">Cargar ejemplo</span>
          <button className="btn sm" onClick={()=>loadExample("pequena")}>Pequeña</button>
          <button className="btn sm" onClick={()=>loadExample("mediana")}>Mediana</button>
          <button className="btn sm" onClick={()=>loadExample("grande")}>Grande</button>
          <button className="btn sm gh" onClick={clearForm}>Limpiar</button>
        </div>
        <button className="btn gh" onClick={exportAll}><Ico d={icons.down} width="15" height="15"/>Exportar respaldo</button>
        <button className="btn gh" onClick={()=>fileRef.current.click()}><Ico d={icons.up} width="15" height="15"/>Importar respaldo</button>
        <input ref={fileRef} type="file" accept="application/json" style={{display:"none"}} onChange={importAll}/>
      </div>
    </aside>
    <main className="main">
      {view==="evaluar"&&<Evaluar cfg={cfg} cur={cur} setCur={setCur} onSave={(c)=>saveToPf(c)} resetKey={resetKey} setTip={setTip}/>}
      {view==="portafolio"&&<Portafolio cfg={cfg} portfolio={portfolio} setPortfolio={setPortfolio} onEdit={editPf}/>}
      {view==="capacidad"&&<Capacidad cfg={cfg} portfolio={portfolio} capacity={capacity} setCapacity={setCapacity}/>}
      {view==="calibracion"&&<Calibracion cfg={cfg} portfolio={portfolio} setPortfolio={setPortfolio}/>}
      {view==="sfia"&&<Sfia/>}
      {view==="parametros"&&<Parametros cfg={cfg} setCfg={setCfg} onReset={reset}/>}
    </main>
    {tip&&<div className="ctip" style={{left:Math.min(tip.x+16,window.innerWidth-280),top:Math.min(tip.y+18,window.innerHeight-160)}}>{tip.t}</div>}
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
